<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/checkout.css">
</head>
<body>
    <div class="checkout-page">
        <div class="checkout-contanier uni-container">
           <div class="checkout-top-content">
               <div class="checkout-top-left">
                   <h3 class="check-title">Checkout</h3>
                   <p class="check-sub-title">Cart Type</p>
                   <div class="payment-select-div">
                       <img src="../images/Group 307.png" alt="">
                       <img src="../images/am_amex_06 1.png" alt="">
                       <img src="../images/visa.png" alt="">
                       <img src="../images/Group 307.png" alt="">
                       <!-- <img src="" alt=""> -->
                   </div>
                   <form action="" class="check-out-form">
                       <label for="">Name on Card</label>
                       <input type="text"
                       placeholder="Enter name on Card"
                       >
                       <label for="">Card Number</label>
                       <input type="text"
                       placeholder="Enter Card Number"
                       >
                       <div class="expire-div">
                           <div class="expire-div-1">
                               <label for="">Expiration Date ( MM/YY )</label>
                                <input type="text"
                                placeholder="Enter Expiration Date"
                                >
                           </div>
                           <div class="expire-div-1">
                                <label for="">CVC</label>
                                <input type="text"
                                placeholder="Enter Expiration Date"
                                >
                           </div>
                       </div>
                      <div class="check-div">
                         <input type="checkbox">
                       <p>Save my information for faster checkout</p>
                      </div>
                      <button class="confirm-btn">Confirm Payment</button>
                   </form>
               </div>
               <div class="checkout-top-right">
                       <p>Summary</p>
                       <div class="course-price-div">
                           <div class="course-img-wrp">
                            <img src="../images/loren.png" alt="">
                           </div>
                           <div class="course-det-wrp">
                             <p class="intro">Introduction to Ghalib’s Persian Poetry</p>
                             <p class="desc-p">Lorem ipsum dollar...</p>
                             <p class="price-p">₹24.69</p>
                           </div>
                       </div>
               </div>
           </div>
           <div class="checkout-bottom-content">
                 

           </div>
        </div>
    </div>
</body>
</html>
