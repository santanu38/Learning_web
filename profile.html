        <div class="sidebar_wrapper2 sidebar2_not_active">

            right: 0;font-size: 25px;" id="caret_id"></i>
            <div class="sidebar_links">

                <a href="./dashboard.html" class="sidebar_link_wrapper">
                    <i class="fa-solid fa-house"></i>
                    <p>Dashboard</p>
                </a>

                <a href="./students.html" class="sidebar_link_wrapper">
                    <i class="fa-solid fa-graduation-cap"></i>
                    <p>Students</p>
                </a>

                <a href="./assignment.html" class="sidebar_link_wrapper">
                    <i class="fa-solid fa-note-sticky"></i>
                    <p>Assignment</p>
                </a>

                <a href="./notification.html" class="sidebar_link_wrapper">
                    <i class="fa-regular fa-bell"></i>
                    <p>Notification</p>
                </a>

                <a href="./calendar.html" class="sidebar_link_wrapper">

                <a href="./profile.html" class="sidebar_link_wrapper">

                </a>
            </div>
            <div class="blue-card">

                    <div>

                    </div>
                    <div>
                        <img src="/images/notice/hand-drawn-baker-cartoon-illustration_23-2150803190-removebg-preview 1.png"
                            alt="" srcset="">
                    </div>

                </div>
            </div>
        </div>
        <div class="center_layout">
            <div class="dahsboard_header">
                <div class="dashboard_input_wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Search here" />
                </div>

                <div class="dashboard_notification_wrapper">
                    <div class="bell_wrapper">
                        <i class="fa-regular fa-bell"></i>
                        <span>21</span>
                    </div>
                    <div class="bell_wrapper" style="background-color: transparent; padding: 0 0;">
                        <span>21</span>
                        <i class="fa-solid fa-trash"></i>
                    </div>
                    <div class="bell_wrapper" style="background-color: transparent; padding: 0 0;">
                        <span>21</span>
                        <i class="fa-solid fa-gear"></i>
                    </div>
                    <div class="user_name_wrapper">
                        <p><span>Hello,</span> Trishit</p>
                        <img src="./images/image (9).png" />
                    </div>
                    <div>
                        <i class="fa-solid fa-bars" id="dashboard_menu_bar"></i>
                    </div>
                </div>



            </div>
            <div class="batch_wrapper">
                <div class="add_assignment_wrapper" style="margin-top: 0;">

                    <div class="assignment_input_wrapper" style="width: 100%;">
                        <label>
                            Profile
                        </label>
                        <img src="./images/image (12).png"
                            style="width: 100px; height: 100px; border-radius: 50%;border: 2px solid #aeaeae;" />
                    </div>
                    <div class="assignment_input_wrapper">
                        <label>
                            Assignment schedules
                        </label>
                        <input type="date" />
                    </div>

                    <div class="assignment_input_wrapper">
                        <label>
                            Submission Time </label>
                        <input type="time" />
                    </div>



                    <div class="assignment_input_wrapper">
                        <label>
                            Important reminders
                        </label>
                        <input type="text" />
                    </div>



                    <div class="assignment_input_wrapper">
                        <label>
                            Batch Name
                        </label>
                        <select>
                            <option>Batch 1</option>
                        </select>
                    </div>


                    <div class="assignment_input_wrapper">
                        <label>
                            Description
                        </label>
                        <textarea
                            placeholder="Lorem Ipsum is simply dummy text of the printing and typesetting industry."></textarea>
                    </div>


                    <div class="assignment_input_wrapper">
                        <label>
                            Submission Date
                        </label>
                        <input type="date" />
                    </div>

                </div>
                <button class="submit_button78999">Submit</button>



            </div>

        </div>
    </div>
    <script>
        const sidebar = document.querySelector('.sidebar_wrapper2');
        const menu = document.getElementById('dashboard_menu_bar');
        const caret = document.getElementById('caret_id')

        menu.addEventListener('click', ((e) => {
            if (sidebar.classList.contains('sidebar2_not_active')) {
                sidebar.classList.add('sidebar2_active');
                sidebar.classList.remove('sidebar2_not_active')
            } else {
                sidebar.classList.add('sidebar2_not_active');
                sidebar.classList.remove('sidebar2_active')
            }
        }))

        caret.addEventListener('click', ((e) => {
            if (sidebar.classList.contains('sidebar2_not_active')) {
                sidebar.classList.add('sidebar2_active');
                sidebar.classList.remove('sidebar2_not_active')
            } else {
                sidebar.classList.add('sidebar2_not_active');
                sidebar.classList.remove('sidebar2_active')
            }
        }))
    </script>
</body>
