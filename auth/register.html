<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./login.css" />
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Sora:wght@100..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
</head>

<body>
    <div class="login_wrapper">
        <div class="login_container">
            <div class="login_img">
                <img src="../images/Group 232.png" />
                <div class="login_heading">
                    <h1>Welcome to Urdu Learning</h1>
                    <p>Lorem Ipsum is simply </p>
                </div>
            </div>

            <div class="login_form_wrapper">
                <h3>Welcome to Urdu Learning</h3>
                <div class="login_tabs_wrapper">
                    <div><a href="./login.html">Login</a></div>
                    <div class="active"><a>Register</a></div>
                </div>
                <p>Lorem Ipsum is simply dummy text of the printing
                    and typesetting industry.</p>
                <form style="width: 100%;display: flex;flex-direction: column;row-gap: 25px;">

                    <div class="form_input_wrapper">
                        <label>Email Address</label>
                        <input placeholder="Enter your Email Address" />
                    </div>



                    <div class="form_input_wrapper">
                        <label>User name</label>
                        <input placeholder="Enter your User Name" />
                    </div>


                    <div class="form_input_wrapper">
                        <label>Password</label>
                        <input placeholder="Enter your password" type="password" />
                        <i class="fa-solid fa-eye"></i>
                    </div>

                    <div class="rember_forgot_password_wrapper">
                        <div class="remember_password_wrapper">
                            <input type="checkbox" />
                            <small>Remember me</small>
                        </div>
                        <a>Forgot Password ?</a>
                    </div>

                    <button class="login_btn">Register</button>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
