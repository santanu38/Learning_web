<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher's Dashboard</title>
    <link rel="stylesheet" href="./css/dashboard.css" />
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Sora:wght@100..800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" />
    <script src="
     https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js">
    </script>
    <link href="
     https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" />

</head>

<body class="body_class">
    <div class="dashboard_container">
        <div class="sidebar_wrapper">
            <img src="./images/Logo.png" />
            <div class="sidebar_links">

                <a href="" class="sidebar_link_wrapper">
                    <i class="fa-solid fa-house"></i>
                    <p>Dashboard</p>
                </a>

                <a class="sidebar_link_wrapper">
                    <i class="fa-solid fa-graduation-cap"></i>
                    <p>Students</p>
                </a>

                <a class="sidebar_link_wrapper">
                    <i class="fa-solid fa-note-sticky"></i>
                    <p>Assignment</p>
                </a>

                <a class="sidebar_link_wrapper">
                    <i class="fa-regular fa-bell"></i>
                    <p>Notification</p>
                </a>

                <a class="sidebar_link_wrapper">
                    <i class="fa-regular fa-calendar"></i>
                    <p>Calendar</p>
                </a>

                <a class="sidebar_link_wrapper">
                    <i class="fa-regular fa-user"></i>
                    <p>Profile</p>
                </a>
                <a class="sidebar_link_wrapper">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    <p>Log Out</p>
                </a>
            </div>
        </div>
        <div class="center_layout">
            <div class="dahsboard_header">
                <div class="dashboard_input_wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Search here" />
                </div>

                <div class="dashboard_notification_wrapper">
                    <div class="bell_wrapper">
                        <i class="fa-regular fa-bell"></i>
                        <span>21</span>
                    </div>
                    <div class="bell_wrapper" style="background-color: transparent; padding: 0 0;">
                        <span>21</span>
                        <i class="fa-solid fa-trash"></i>
                    </div>
                    <div class="bell_wrapper" style="background-color: transparent; padding: 0 0;">
                        <span>21</span>
                        <i class="fa-solid fa-gear"></i>
                    </div>
                    <div class="user_name_wrapper">
                        <p><span>Hello,</span> Trishit</p>
                        <img src="./images/image (9).png" />
                    </div>
                </div>



            </div>
            <div class="dashboard_content_wrapper">
                <div class="dashboard_content_wrapper_main">
                    <div class="dashboard_cards_wrapper">
                        <div class="dashboard_card">
                            <div class="dashboard_card_header_content">
                                <div class="dashboard_percentage"><i class="fa-solid fa-arrow-up"></i>
                                    <p>15%</p>
                                </div>
                                <i class="fa-solid fa-ellipsis"></i>
                            </div>
                            <h2>124,684</h2>
                            <h4>Students</h4>
                        </div>

                        <div class="dashboard_card_2">
                            <div class="dashboard_card_2_header_content">
                                <div class="dashboard_percentage"><i class="fa-solid fa-arrow-up"></i>
                                    <p>15%</p>
                                </div>
                                <i class="fa-solid fa-ellipsis"></i>
                            </div>
                            <h2>12,379</h2>
                            <h4>Assignments</h4>
                        </div>


                        <div class="dashboard_card_3">
                            <div class="dashboard_card_3_header_content">
                                <div class="dashboard_percentage"><i class="fa-solid fa-arrow-up"></i>
                                    <p>15%</p>
                                </div>
                                <i class="fa-solid fa-ellipsis"></i>
                            </div>
                            <h2>29,300</h2>
                            <h4>Total Class</h4>
                        </div>


                        <div class="dashboard_card_4">
                            <div class="dashboard_card_4_header_content">
                                <div class="dashboard_percentage"><i class="fa-solid fa-arrow-up"></i>
                                    <p>15%</p>
                                </div>
                                <i class="fa-solid fa-ellipsis"></i>
                            </div>
                            <h2>29,300</h2>
                            <h4>Total Class</h4>
                        </div>
                    </div>

                    <div class="dashboard_calendar_wrapper">
                        <div class="calendar-container" style="width: 100%;">
                            <div id="myCalendar" class="flatpickr-input" style="width: 100%;"></div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script>
        flatpickr("#myCalendar", {
            dateFormat: "d M Y",
            inline: true,
            defaultDate: "2025-09-11",

        });
    </script>
</body>

</html>
